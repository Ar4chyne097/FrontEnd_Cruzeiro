<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script src="jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Aula 13 - MiniProjeto - Index</title>
    <script>
      $(function () {
            $.getJSON("https://www.mfpledon.com.br/cafeteriaJSON4.php",
                function (dados) {
                    var N = dados.length;
                    var htmlContent = "";
                    let soma = 0, bebida = 0;
                    
                    for (var i = 0; i < N; i++) {
                    
                        htmlContent += `
                            <div class="card-item">
                                <div class="item-info">
                                    <span class="item-codigo">#${dados[i].codigo}</span>
                                    <h4 class="item-nome">${dados[i].nome}</h4>
                                    <span class="item-tipo">${dados[i].tipo}</span>
                                </div>
                                <div class="item-preco">
                                    R$ ${parseFloat(dados[i].preco).toFixed(2).replace('.', ',')}
                                </div>
                            </div>
                            <hr>
                            <br>
                        `;
                        if(dados[i].tipo == 'bebida'){
                            bebida += parseFloat(dados[i].preco)
                        }
                        soma += parseFloat(dados[i].preco)
                    }
                    let mediaP = soma/N, mediaB = bebida/N

                    let str = "Média dos preços dos itens do cardápio: <br>" + mediaP.toFixed(2)
                    let str2 = "<br>Média dos preços das bebidas do cardápio: <br>"+ mediaB.toFixed(2)                    

                    $("#iddiv").html(htmlContent);
                    $("#iddiv").append("<br>" + str)
                    $("#iddiv").append("<br>" + str2)
                });
        });

    </script>
</head>

<body>
    <h3>Exemplo de acesso a dados em formato JSON gerados remotamente por uma página PHP</h3>
    <div id="iddiv" ></div>
</body>

</html>
